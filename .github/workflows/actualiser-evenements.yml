
name: Actualiser les événements du Loir-et-Cher

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install requests

      - name: Vérifier la syntaxe Python
        run: python -m py_compile scripts/actualiser_evenements.py

      - name: Récupérer les événements DATAtourisme
        env:
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
        run: python scripts/actualiser_evenements.py

      - name: Enregistrer les événements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Actualisation automatique des événements"
          git push
