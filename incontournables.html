<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tous les incontournables — Loir-et-Cher 41</title><meta name="description" content="Châteaux, nature, villes et villages incontournables du Loir-et-Cher."><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f0;color:#22332d;font:16px/1.55 Arial,sans-serif}header{background:white;border-bottom:1px solid #e5e1d7;padding:20px max(24px,calc((100vw - 1100px)/2))}a{color:#173f32}header a{font-weight:bold;text-decoration:none}main{max-width:1100px;margin:auto;padding:55px 24px 80px}h1{font:normal clamp(34px,5vw,52px) Georgia,serif;color:#173f32;margin:8px 0 14px}.intro{color:#647169;max-width:690px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}.filters button{background:white;border:1px solid #d9d6cc;border-radius:25px;padding:9px 16px;cursor:pointer;color:#173f32}.filters button.active{background:#173f32;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid #ece8df;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.card img{width:100%;height:190px;object-fit:cover}.body{padding:22px;display:flex;flex-direction:column;flex:1}.label{color:#8b6c37;text-transform:uppercase;letter-spacing:1px;font-size:11px;font-weight:bold}.card h2{font:normal 25px Georgia,serif;color:#173f32;margin:8px 0}.desc{font-size:14px;color:#596960;flex:1}.links{display:flex;flex-wrap:wrap;gap:15px;margin-top:14px}.links a{font-size:13px;font-weight:bold}footer{background:#173f32;color:white;text-align:center;padding:30px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}main{padding-top:35px}}</style></head><body><header><a href="index.html#incontournables">← Retour à l'accueil</a></header><main><p class="label">Patrimoine & découvertes</p><h1>Tous les incontournables du 41</h1><p class="intro">Retrouvez les sites touristiques de notre sélection, classés par thème. Choisissez un lieu pour préparer votre visite.</p><div class="filters" id="filters"><button class="active" data-type="all">Tout voir</button><button data-type="chateaux">Châteaux</button><button data-type="nature">Nature & loisirs</button><button data-type="villes">Villes & villages</button></div><div class="grid" id="grid"></div></main><footer>Loir-et-Cher 41 · Découvrir le département</footer><script>const places=[
{id:'chambord',name:'Domaine national de Chambord',city:'Chambord',postal:'41250',type:'chateaux',label:'Château & domaine',desc:'Un chef-d’œuvre de la Renaissance au cœur d’un vaste domaine forestier.',img:'https://upload.wikimedia.org/wikipedia/commons/8/80/France_Loir-et-Cher_Chambord_Chateau_03.jpg',url:'https://www.chambord.org/',map:'Domaine national de Chambord'},
{id:'blois',name:'Château royal de Blois',city:'Blois',postal:'41000',type:'chateaux',label:'Château royal',desc:'Quatre grandes périodes architecturales réunies autour d’une cour remarquable.',img:'https://upload.wikimedia.org/wikipedia/commons/c/cb/Ch%C3%A2teau_de_Blois_-_Fa%C3%A7ade_des_Loges.jpg',photoCredit:'Photo : Cussenot / Wikimedia Commons (CC0)',url:'https://www.chateaudeblois.fr/',map:'Château royal de Blois'},
{id:'cheverny',name:'Château de Cheverny',city:'Cheverny',postal:'41700',type:'chateaux',label:'Château & jardins',desc:'Un château meublé et habité, connu aussi pour son lien avec Moulinsart.',img:'https://upload.wikimedia.org/wikipedia/commons/9/9d/Fa%C3%A7ade_du_Ch%C3%A2teau_de_Cheverny.jpg',photoCredit:'Photo : Aliasse16 / Wikimedia Commons (CC BY-SA 4.0)',url:'https://www.chateau-cheverny.fr/',map:'Château de Cheverny'},
{id:'chaumont',name:'Domaine de Chaumont-sur-Loire',city:'Chaumont-sur-Loire',postal:'41150',type:'chateaux',label:'Château & jardins',desc:'Un domaine où patrimoine, art contemporain et création paysagère se rencontrent.',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Chateau%20de%20Chaumont-sur-Loire.JPG?width=1200',url:'https://domaine-chaumont.fr/',map:'Domaine de Chaumont-sur-Loire'},
{id:'beauval',name:'ZooParc de Beauval',city:'Saint-Aignan',postal:'41110',type:'nature',label:'Parc animalier',desc:'Un grand parc zoologique engagé dans la conservation des espèces.',img:'https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?auto=format&fit=crop&w=900&q=85',url:'https://www.zoobeauval.com/',map:'ZooParc de Beauval'},
{id:'sologne',name:'Forêts et étangs de Sologne',city:'Sologne',postal:'41',type:'nature',label:'Nature & randonnée',desc:'Des paysages de forêts, de landes et d’étangs à découvrir dans le respect des milieux naturels.',img:'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=85',url:'https://www.tourisme-sologne.fr/',map:'Sologne Loir-et-Cher'},
{id:'vendome',name:'Vendôme et les bords du Loir',city:'Vendôme',postal:'41100',type:'villes',label:'Ville & patrimoine',desc:'Abbaye de la Trinité, portes anciennes, jardins et promenades au fil de l’eau.',img:'https://cdn.iris-etourism.io/uploads/crt_centre_val_de_loire/955/chevet-abbatiale-trinite--0090.webp',url:'https://www.vendome-tourisme.fr/',map:'Vendôme Loir-et-Cher'},
{id:'lavardin',name:'Lavardin, village de caractère',city:'Lavardin',postal:'41800',type:'villes',label:'Village & patrimoine',desc:'Un village remarquable au bord du Loir, dominé par les vestiges de son château médiéval.',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Village_Lavardin.jpg?width=1000',url:'https://www.lavardin.net/',map:'Lavardin Loir-et-Cher'},
{id:'troo',name:'Trôo, cité troglodytique',city:'Trôo',postal:'41800',type:'villes',label:'Village & patrimoine',desc:'Un village en terrasses, avec ruelles, escaliers, caves et habitations creusées dans le coteau.',img:'https://www.vendome-tourisme.fr/app/uploads/vendome/2025/01/thumbs/Troo-4.1-productions-4-640x360.webp',url:'https://www.vendome-tourisme.fr/4-bonnes-raisons-de-venir-flaner/montoire-sur-le-loir/',map:'Trôo Loir-et-Cher'},
{id:'montoire',name:'Montoire-sur-le-Loir',city:'Montoire-sur-le-Loir',postal:'41800',type:'villes',label:'Ville & patrimoine',desc:'Un parcours de découverte, la chapelle Saint-Gilles, Musikenfête et le patrimoine du vieux Montoire.',img:'https://www.vendome-tourisme.fr/app/uploads/vendome/2022/07/thumbs/Montoire2022%C2%A9ElodiePLEUVRY-14-1920x1080.jpg',url:'https://www.vendome-tourisme.fr/4-bonnes-raisons-de-venir-flaner/montoire-sur-le-loir/',map:'Montoire-sur-le-Loir'},

{id:'romorantin',name:'Romorantin-Lanthenay',city:'Romorantin-Lanthenay',postal:'41200',type:'villes',label:'Ville & musées',desc:'Une ville au cœur de la Sologne, avec notamment le musée de Sologne et l’espace Matra.',img:'https://commons.wikimedia.org/wiki/Special:FilePath/La%20Sauldre%20%C3%A0%20Romorantin%20%28Loir-et-Cher%29%20%284144325645%29.jpg?width=900',url:'https://www.sologne-tourisme.fr/',map:'Romorantin-Lanthenay'}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(type='all'){document.getElementById('grid').innerHTML=places.filter(p=>type==='all'||p.type===type).map(p=>'<article class="card"><img loading="lazy" src="'+esc(p.img)+'" alt="'+esc(p.name)+'"><div class="body"><div class="label">'+esc(p.label)+' · '+esc(p.city)+'</div><h2>'+esc(p.name)+'</h2><p class="desc">'+esc(p.desc)+'</p><div class="links"><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">Site officiel ↗</a><a href="https://www.openstreetmap.org/search?query='+encodeURIComponent(p.map)+'" target="_blank" rel="noopener noreferrer">Localiser ↗</a></div></div></article>').join('')}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.type)}));render();</script></body></html>
